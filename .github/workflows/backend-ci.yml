name: backend-ci

on:
  push:
    branches: [main, 'feat/**']
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jansetu_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jansetu_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jansetu_ci?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-000000000000000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-00000000000000000000000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

      - name: OpenAPI spec is up to date
        run: |
          npm run openapi:gen
          git diff --exit-code openapi.json \
            || (echo "::error::openapi.json is stale — run 'npm run openapi:gen' and commit it" && exit 1)

      - run: npm run build
